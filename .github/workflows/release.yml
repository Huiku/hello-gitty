name: Build installers

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            platform: macos-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            platform: macos-apple-silicon
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon tooling
        run: python -m pip install pillow numpy opencv-python-headless
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Use crates.io on GitHub runners
        shell: bash
        run: rm -f src-tauri/.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Check frontend syntax and branch search
        shell: bash
        run: |
          for file in src/main.js src/js/*.js scripts/*.mjs; do node --check "$file"; done
          npm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build installer
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Validate macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hello Gitty.app"
          hdiutil verify src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Test installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Resolve-Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "hello-gitty-installed"
          $installer = Start-Process -FilePath $setup -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer exited with code $($installer.ExitCode)"
          }

          $exe = Join-Path $installDir "hello-gitty.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed executable not found at $exe"
          }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Installed Hello Gitty exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F
            }
          }

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) {
            throw "Executable remains after uninstall"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hello-gitty-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: hello-gitty-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --title "Hello Gitty $GITHUB_REF_NAME" --generate-notes
